[project]
name = "construction-coordination-agent"
version = "0.1.0"
description = "Local-first development services for Concord"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.8,<3", "sqlalchemy>=2.0,<3", "alembic>=1.15,<2",
  "dbos>=2,<3", "python-multipart>=0.0.20", "httpx>=0.28,<1", "tzdata>=2025.2"
]
[project.optional-dependencies]
models = ["openai>=3.8,<4", "pydantic-ai-slim[openai,anthropic,google]>=2.40,<3", "pillow>=11,<13"]
bim = ["ifcopenshell>=0.8.5,<0.9"]
optimization = ["ortools>=9.12,<10"]
documents = ["docling>=2,<3"]
storage = ["minio>=7.2.20,<8", "urllib3>=2.3,<3"]
server = ["psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1"]
temporal = ["temporalio>=1.10,<2"]
telemetry = ["opentelemetry-sdk>=1.31,<2", "opentelemetry-exporter-otlp-proto-http>=1.31,<2"]
desktop = ["pyinstaller>=6.12,<7", "ifcopenshell>=0.8.5,<0.9"]
[dependency-groups]
dev = ["pillow>=11,<13", "pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11", "pyright>=1.1", "import-linter>=2", "deptry>=0.23"]
[project.scripts]
cca = "app.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["backend/app"]
[tool.hatch.build.targets.wheel.force-include]
"backend/migrations" = "app/migrations"
"backend/vector_migrations" = "app/vector_migrations"
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
markers = ["integration: requires optional local dependencies or services", "live: requires paid model credentials"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Header", "fastapi.Query"]
[tool.pyright]
include = ["backend/app"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
